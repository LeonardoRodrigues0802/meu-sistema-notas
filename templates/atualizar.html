<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Atualizar Notas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary p-4 shadow" style="width: 400px;">
        <h3>✏️ Atualizar Notas</h3>
        {% if msg %}<div class="alert {% if sucesso %}alert-success{% else %}alert-danger{% endif %} py-1">{{ msg }}</div>{% endif %}
        <form method="POST">
            <div class="mb-2"><label>ID do Aluno</label><input type="number" name="id" class="form-control" required></div>
            <div class="mb-2"><label>Nova Nota 1</label><input type="number" step="0.1" name="nota1" class="form-control" required></div>
            <div class="mb-2"><label>Nova Nota 2</label><input type="number" step="0.1" name="nota2" class="form-control" required></div>
            <div class="mb-3"><label>Nova Nota 3</label><input type="number" step="0.1" name="nota3" class="form-control" required></div>
            <button type="submit" class="btn btn-warning w-100 mb-2">Atualizar</button>
            <a href="/painel" class="btn btn-light w-100">Voltar</a>
        </form>
    </div>
</body>
</html>

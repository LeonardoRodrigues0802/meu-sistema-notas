<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h2>📋 Lista de Alunos</h2>
        <table class="table table-dark table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th><th>Nome</th><th>N1</th><th>N2</th><th>N3</th><th>Média</th><th>Situação</th>
                </tr>
            </thead>
            <tbody>
                {% for a in alunos %}
                <tr>
                    <td>{{ a.id }}</td>
                    <td>{{ a.nome }}</td>
                    <td>{{ a.nota1 }}</td>
                    <td>{{ a.nota2 }}</td>
                    <td>{{ a.nota3 }}</td>
                    <td>{{ "%.1f"|format(a.media) }}</td>
                    <td>
                        <span class="badge {% if a.situacao == 'Aprovado' %}bg-success{% elif a.situacao == 'Recuperação' %}bg-warning text-dark{% else %}bg-danger{% endif %}">
                            {{ a.situacao }}
                        </span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/painel" class="btn btn-secondary">⬅️ Voltar ao Painel</a>
    </div>
</body>
</html>

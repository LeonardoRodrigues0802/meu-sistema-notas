<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Logs de Acesso</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h2>📝 Registro de Acessos</h2>
        <table class="table table-dark table-striped mt-3">
            <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Tipo</th><th>Status</th></tr></thead>
            <tbody>
                {% for l in registros %}
                <tr><td>{{ l.data_hora }}</td><td>{{ l.usuario }}</td><td>{{ l.tipo }}</td><td>{{ l.status }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/painel" class="btn btn-secondary mt-3">Voltar ao Painel</a>
    </div>
</body>
</html>

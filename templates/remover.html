<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Remover Aluno</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">
    <div class="card bg-secondary p-4 shadow" style="width: 350px;">
        <h3>🗑️ Remover Aluno</h3>
        {% if msg %}<div class="alert {% if sucesso %}alert-success{% else %}alert-danger{% endif %} py-1">{{ msg }}</div>{% endif %}
        <form method="POST">
            <div class="mb-3"><label>ID do Aluno</label><input type="number" name="id" class="form-control" required></div>
            <button type="submit" class="btn btn-danger w-100 mb-2">Remover</button>
            <a href="/painel" class="btn btn-light w-100">Voltar</a>
        </form>
    </div>
</body>
</html>

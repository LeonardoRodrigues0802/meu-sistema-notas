<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Top 3 Alunos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h2>🏆 Top 3 Melhores Alunos</h2>
        <ol class="list-group list-group-numbered mt-4">
            {% for a in ranking %}
            <li class="list-group-item bg-secondary text-light d-flex justify-content-between align-items-start my-1">
                <div class="ms-2 me-auto">
                    <div class="fw-bold">{{ a.nome }}</div>
                    Média: {{ "%.1f"|format(a.media) }} — Situação: {{ a.situacao }}
                </div>
            </li>
            {% endfor %}
        </ol>
        <a href="/painel" class="btn btn-secondary mt-4">Voltar ao Painel</a>
    </div>
</body>
</html>

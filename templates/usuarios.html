<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Gerenciar Usuários</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h2>👥 Gerenciar Usuários</h2>
        {% if msg %}<div class="alert {% if sucesso %}alert-success{% else %}alert-danger{% endif %} py-1">{{ msg }}</div>{% endif %}
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card bg-secondary p-3">
                    <h4>Cadastrar Novo Usuário</h4>
                    <form method="POST">
                        <input type="hidden" name="acao" value="cadastrar">
                        <div class="mb-2"><label>Usuário</label><input type="text" name="novo_usuario" class="form-control" required></div>
                        <div class="mb-2"><label>Senha</label><input type="password" name="nova_senha" class="form-control" required></div>
                        <div class="mb-3"><label>Tipo</label><select name="novo_tipo" class="form-select"><option value="funcionario">Funcionário</option><option value="admin">Admin</option></select></div>
                        <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                    </form>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-secondary p-3">
                    <h4>Usuários Existentes</h4>
                    <ul class="list-group mt-2">
                        {% for u in usuarios %}
                        <li class="list-group-item bg-dark text-light d-flex justify-content-between align-items-center">
                            {{ u.usuario }} ({{ u.tipo }})
                            <form method="POST" class="m-0"><input type="hidden" name="acao" value="remover"><input type="hidden" name="remover_usuario" value="{{ u.usuario }}"><button type="submit" class="btn btn-sm btn-danger">X</button></form>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
        <a href="/painel" class="btn btn-secondary mt-4">Voltar ao Painel</a>
    </div>
</body>
</html>
